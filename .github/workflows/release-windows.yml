# Build portable Windows ZIP (release only — not part of PR test CI).
name: Release Windows portable ZIP

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for the ZIP (e.g. 0.1.0)"
        required: true
        default: "0.0.0-dev"

jobs:
  build-portable-zip:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-packaging.txt

      - name: PyInstaller bundle
        working-directory: backend
        run: pyinstaller pyinstaller.spec

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          ./scripts/windows/assemble-portable.ps1 -Version ${{ steps.version.outputs.value }}

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: lego-collection-manager-windows-portable
          path: dist/windows-portable/*.zip
          if-no-files-found: error
